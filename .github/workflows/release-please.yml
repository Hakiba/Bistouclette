name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Avec le GITHUB_TOKEN, la PR de release ne lance pas le CI : le check
      # obligatoire la bloquerait. Un token personnel (secret RELEASE_PLEASE_TOKEN)
      # corrige cela ; sans lui, on retombe sur le GITHUB_TOKEN.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Un tag créé avec le GITHUB_TOKEN ne déclenche aucun autre workflow : le
  # déploiement est donc appelé directement ici, uniquement quand une release
  # vient d'être publiée.
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
